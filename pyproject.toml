[project]
name = "trafficml"
version = "0.1.0"
description = "Phase 1 (classical ML) pipeline for METR-LA traffic-speed forecasting — Project 4, Team T082"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "xgboost>=2.0",
  "h5py>=3.9", "matplotlib>=3.8", "seaborn>=0.13", "networkx>=3.1",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbformat", "nbconvert"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
